name: update-release

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: update-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-my-flakes:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    outputs:
      updated: ${{ steps.collect.outputs.updated }}
      pkgs: ${{ steps.collect.outputs.pkgs }}
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_AUTHOR_EMAIL: >-
        ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
      GIT_AUTHOR_NAME: ${{ github.actor }}
      USER: runner
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: config-git
        run: |
          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: setup nix
        uses: ./.github/actions/setup-nix
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: record base revision
        id: get-base
        run: |
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: update my-flakes
        run: nix run --accept-flake-config .#update-release -- --push

      - name: collect outputs
        id: collect
        run: |
          pkgs=$(nix eval --raw ".#packages.x86_64-linux" \
            --apply 'p: builtins.concatStringsSep " " (builtins.attrNames p)' \
            --accept-flake-config)
          echo "pkgs=$pkgs" >> "$GITHUB_OUTPUT"
          if git diff --quiet "${{ steps.get-base.outputs.base }}" HEAD -- \
            flake.lock flake.nix apps/ packages/ releases/ .github/; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

  build-my-flakes:
    needs: update-my-flakes
    # if: needs.update-my-flakes.outputs.updated == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      PKGS: ${{ needs.update-my-flakes.outputs.pkgs }}
      USER: runner
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: setup nix
        uses: ./.github/actions/setup-nix
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: build shard packages
        run: |
          failed_pkgs=()
          shard_pkgs=()
          pinned_shard() {
            case "$1" in
            hypr*|aquamarine|xdg-desktop-portal-hyprland|grim|slurp)
              printf 4
              return 0
              ;;
            obs-studio|obs-pipewire-audio-capture|obs-vkcapture)
              printf 2
              return 0
              ;;
            libfprint|fprintd)
              printf 0
              return 0
              ;;
            wl-clipboard|espanso-wayland)
              printf 5
              return 0
              ;;
            esac
            return 1
          }
          i=0
          IFS=' ' read -ra all_pkgs <<< "$PKGS"
          for pkg in "${all_pkgs[@]}"; do
            case "$pkg" in
            linux*) ;;
            *)
              s=$(( i % ${{ strategy.job-total }} ))
              (( ++i ))
              if p=$(pinned_shard "$pkg"); then
                s="$p"
              fi
              if (( s == ${{ matrix.shard }} )); then
                shard_pkgs+=("$pkg")
              fi
              ;;
            esac
          done
          if (( ${#shard_pkgs[@]} == 0 )); then
            echo "::error::shard ${{ matrix.shard }} built no packages"
            exit 1
          fi
          targets=()
          for pkg in "${shard_pkgs[@]}"; do
            targets+=(".#packages.x86_64-linux.$pkg")
          done
          permanent_error_pattern='returned error: (400|401|403|404|410)|hash mismatch|option not set correctly'
          build_pkg() {
            local pkg="$1"
            local attempt
            local output
            for attempt in 1 2 3 4 5; do
              if output=$(nix build ".#packages.x86_64-linux.$pkg" \
                --print-build-logs --keep-going --accept-flake-config 2>&1); then
                printf '%s\n' "$output" >&2
                return 0
              fi
              printf '%s\n' "$output" | tail -n 20 >&2
              if printf '%s\n' "$output" | grep -qE "$permanent_error_pattern"; then
                echo "permanent failure for $pkg, not retrying" >&2
                return 1
              fi
              if (( attempt < 5 )); then
                echo "retrying $pkg after failed build (attempt $((attempt + 1))/5)"
                sleep $((15 * (2 ** (attempt - 1))))
              fi
            done
            return 1
          }
          if ! nix build --print-build-logs --keep-going --accept-flake-config "${targets[@]}"; then
            for pkg in "${shard_pkgs[@]}"; do
              if ! build_pkg "$pkg"; then
                echo "::error::build failed for $pkg"
                failed_pkgs+=("$pkg")
              fi
            done
          fi
          for pkg in "${shard_pkgs[@]}"; do
            if [[ " ${failed_pkgs[*]} " == *" $pkg "* ]]; then
              continue
            fi
            path=$(nix path-info ".#packages.x86_64-linux.$pkg^out" \
              --accept-flake-config)
            cachix push visoredkon "$path"
            cachix pin visoredkon "latest-$pkg" "$path" --keep-revisions 1
          done
          if (( ${#failed_pkgs[@]} > 0 )); then
            exit 1
          fi

  build-kernel:
    needs: update-my-flakes
    # if: needs.update-my-flakes.outputs.updated == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      PKGS: ${{ needs.update-my-flakes.outputs.pkgs }}
      USER: runner
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: setup nix
        uses: ./.github/actions/setup-nix
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: build kernel packages
        run: |
          failed=0
          built=0
          permanent_error_pattern='returned error: (400|401|403|404|410)|hash mismatch|option not set correctly'
          build_kernel() {
            local target="$1"
            local log="$2"
            local attempt
            local output
            for attempt in 1 2 3 4 5; do
              if output=$(nix build "$target" \
                --print-build-logs --keep-going --accept-flake-config 2>&1); then
                [[ -n "$log" ]] && printf '%s\n' "$output" > "$log"
                return 0
              fi
              [[ -n "$log" ]] && printf '%s\n' "$output" > "$log"
              printf '%s\n' "$output" | tail -n 20 >&2
              if printf '%s\n' "$output" | grep -qE "$permanent_error_pattern"; then
                echo "permanent failure for $target, not retrying" >&2
                return 1
              fi
              if (( attempt < 5 )); then
                echo "retrying $target after failed build (attempt $((attempt + 1))/5)"
                sleep $((15 * (2 ** (attempt - 1))))
              fi
            done
            return 1
          }
          IFS=' ' read -ra all_pkgs <<< "$PKGS"
          for pkg in "${all_pkgs[@]}"; do
            case "$pkg" in
            linux*)
              built=$((built + 1))
              build_target=".#packages.x86_64-linux.$pkg"
              out=$(nix eval --raw "$build_target.outPath" \
                --accept-flake-config)
              log="config-${pkg}.log"
              for cache in \
                "https://cache.lantian.pub/lantian" \
                "https://visoredkon.cachix.org"
              do
                if nix path-info --store "$cache" "$out" >/dev/null 2>&1; then
                  echo "::notice::$pkg is available from $cache"
                  continue 2
                fi
              done
              if ! build_kernel "$build_target.configfile" "$log"; then
                echo "::error::kernel config build failed for $pkg, see $log"
                failed=1
                continue
              fi
              if grep -q "option not set correctly" "$log"; then
                echo "::error::kernel option forced by select, see $log"
                grep "option not set correctly" "$log"
                failed=1
                continue
              fi
              if build_kernel "$build_target^*" ""; then
                mapfile -t out_paths < <(nix build --print-out-paths --no-link \
                  --accept-flake-config "$build_target^*")
                nix path-info -r "${out_paths[@]}" \
                  | xargs cachix push visoredkon
                cachix pin visoredkon "latest-$pkg" "$out" --keep-revisions 1
              else
                echo "::error::build failed for $pkg"
                failed=1
              fi
              ;;
            esac
          done
          if (( built == 0 )); then
            echo "::error::no kernel packages found"
            exit 1
          fi
          exit "$failed"

  update-hytale-launcher:
    runs-on: ubuntu-slim
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.ACTION_ACCESS_HYTALE_LAUNCHER_FLAKE }}
      GIT_AUTHOR_EMAIL: >-
        ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
      GIT_AUTHOR_NAME: ${{ github.actor }}
    steps:
      - name: checkout hytale-launcher-flake
        uses: actions/checkout@v7
        with:
          repository: visoredkon/hytale-launcher-flake
          token: ${{ secrets.ACTION_ACCESS_HYTALE_LAUNCHER_FLAKE }}

      - name: config-git
        run: |
          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          token="${{ secrets.ACTION_ACCESS_HYTALE_LAUNCHER_FLAKE }}"
          base="https://x-access-token:$token@github.com"
          git remote set-url origin "$base/visoredkon/hytale-launcher-flake.git"

      - name: install-nix
        uses: cachix/install-nix-action@v31

      - name: update hytale-launcher
        run: nix run .#update-release -- --push
