name: update-release

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: update-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-my-flakes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_AUTHOR_EMAIL: >-
        ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
      GIT_AUTHOR_NAME: ${{ github.actor }}
      USER: runner
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: config-git
        run: |
          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: install-nix
        uses: cachix/install-nix-action@v31

      - name: setup cachix
        uses: cachix/cachix-action@v17
        with:
          name: visoredkon
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: "(-source$|\\.drv$|go-modules)"

      - name: update my-flakes
        run: nix run .#update-release -- --push

  build-my-flakes:
    needs: update-my-flakes
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      USER: runner
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: install-nix
        uses: cachix/install-nix-action@v31

      - name: setup cachix
        uses: cachix/cachix-action@v17
        with:
          name: visoredkon
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: "(-source$|\\.drv$|go-modules)"

      - name: get packages
        id: get-pkgs
        run: |
          pkgs=$(nix eval --raw ".#packages.x86_64-linux" \
            --apply 'p: builtins.concatStringsSep " " (builtins.attrNames p)' \
            --accept-flake-config)
          echo "pkgs=$pkgs" >> "$GITHUB_OUTPUT"

      - name: build shard packages
        run: |
          i=0
          for pkg in ${{ steps.get-pkgs.outputs.pkgs }}; do
            if (( i % 4 == ${{ matrix.shard }} )); then
              nix build ".#packages.x86_64-linux.$pkg" --print-build-logs
              path=$(nix path-info ".#packages.x86_64-linux.$pkg^out" \
                --accept-flake-config)
              cachix push visoredkon "$path"
              cachix pin visoredkon latest-$pkg "$path" --keep-revisions 1
            fi
            (( ++i ))
          done

  update-hytale-launcher:
    runs-on: ubuntu-slim
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.ACTION_ACCESS_HYTALE_LAUNCHER_FLAKE }}
      GIT_AUTHOR_EMAIL: >-
        ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
      GIT_AUTHOR_NAME: ${{ github.actor }}
    steps:
      - name: checkout hytale-launcher-flake
        uses: actions/checkout@v7
        with:
          repository: visoredkon/hytale-launcher-flake
          token: ${{ secrets.ACTION_ACCESS_HYTALE_LAUNCHER_FLAKE }}

      - name: config-git
        run: |
          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          token="${{ secrets.ACTION_ACCESS_HYTALE_LAUNCHER_FLAKE }}"
          base="https://x-access-token:$token@github.com"
          git remote set-url origin "$base/visoredkon/hytale-launcher-flake.git"

      - name: install-nix
        uses: cachix/install-nix-action@v31

      - name: update hytale-launcher
        run: nix run .#update-release -- --push
